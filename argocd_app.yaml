apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-guestbook
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.slack: platform-alerts
spec:
  project: default
  source:
    repoURL: https://github.com/aneesh2301/test_depolyement.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default